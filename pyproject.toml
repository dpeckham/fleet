[project]
name = "fleet"
version = "0.1.0"
description = "Provision environments on your machines and run agent pools in them"
requires-python = ">=3.13"
dependencies = ["ansible-core>=2.20,<2.22", "click>=8.3,<9", "tomlkit>=0.13,<1"]

[project.scripts]
fleet = "fleet.cli:main"

[dependency-groups]
dev = ["pexpect>=4.9", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]
