- name: Start the agents
  hosts: all
  gather_facts: true
  vars:
    image: "{{ default_image }}"
    instance_missing: fail
  tasks:
    - name: Ensure the instance is running
      ansible.builtin.include_tasks: env-instance.yml
    - name: Enable and start the service
      ansible.builtin.command:
        argv: "{{ env_prefix + ['bash', '-s'] }}"
        stdin: |
          FLEET_REPO_NAME={{ repo_name | quote }}
          FLEET_START={{ repo_start | quote }}
          {{ lookup('file', 'scripts/env-up.sh') }}
      register: up
      changed_when: "'FLEET_CHANGED' in up.stdout"
